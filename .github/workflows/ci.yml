name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint, build & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: itms
          POSTGRES_PASSWORD: itms_dev_password
          POSTGRES_DB: itms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U itms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate dev JWT keys
        run: npm run keys:gen

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build

      - name: Unit tests
        run: npm test

  docker-e2e:
    name: Full stack + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate dev JWT keys
        run: npm run keys:gen

      - name: Configure environment
        run: cp .env.example .env

      - name: Build and start the full stack
        run: npm run infra:up

      - name: Apply migrations
        run: npm run migrate:all

      - name: Bootstrap the first admin account
        run: |
          ADMIN_BOOTSTRAP_EMAIL=admin@itms.example \
          ADMIN_BOOTSTRAP_PASSWORD='change-me-please' \
          npm run bootstrap:admin

      - name: Run the end-to-end smoke test
        run: npm run e2e:smoke

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail=200

      - name: Tear down
        if: always()
        run: npm run infra:down

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
